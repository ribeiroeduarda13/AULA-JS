<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #052b4d, #063638);
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(29, 9, 102, 0.2);
            width: 100%;
            max-width: 350px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        .campo input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #501d4d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #80198a;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .sucesso {
            color: green;
        }

        .erro {
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Login</h2>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <button id="btnEntrar">Entrar</button>

        <p id="mensagem"></p>
    </div>

    <script>
        function realizarLogin() {
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const mensagem = document.getElementById("mensagem");

            if (email === "" || senha === "") {
                mensagem.textContent = "Preencha todos os campos!";
                mensagem.className = "erro";
                return;
            }

            const emailValido = /\S+@\S+\.\S+/;

            if (!emailValido.test(email)) {
                mensagem.textContent = "Digite um e-mail válido!";
                mensagem.className = "erro";
                return;
            }

            
            if (email === "taylorswift@gmail.com" && senha === "123456") {
                mensagem.textContent = "Login realizado com sucesso!";
                mensagem.className = "sucesso";
            } else {
                mensagem.textContent = "E-mail ou senha incorretos!";
                mensagem.className = "erro";
            }
        }

        document
            .getElementById("btnEntrar")
            .addEventListener("click", realizarLogin);
    </script>

</body>
</html>
